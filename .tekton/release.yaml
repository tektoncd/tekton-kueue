apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-pipeline
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[release-v*]"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" && has(body.created) && body.created == true &&
      target_branch.matches("^release-v[0-9]+\\.[0-9]+\\.x$")
    pipelinesascode.tekton.dev/pipeline: tekton/release-pipeline.yaml
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunTemplate:
    serviceAccountName: release
  pipelineRef:
    name: tekton-kueue-release
  params:
  - name: package
    value: github.com/tektoncd/tekton-kueue
  - name: repoName
    value: tekton-kueue
  - name: gitRevision
    value: "{{ revision }}"
  - name: versionTag
    value: '{{ cel: pac.target_branch.replace("release-", "").replace(".x", ".0") }}'
  - name: imageRegistry
    value: ghcr.io
  - name: imageRegistryPath
    value: tektoncd/tekton-kueue
  - name: imageRegistryUser
    value: tekton-robot
  - name: releaseBucket
    value: tekton-releases
  - name: releaseAsLatest
    value: "true"
  - name: platforms
    value: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
  - name: serviceAccountImagesPath
    value: credentials
  - name: runTests
    value: "true"
  - name: previousReleaseTag
    value: ""
  - name: releaseName
    value: ""
  timeouts:
    pipeline: 3h
  workspaces:
  - name: workarea
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
  - name: release-secret
    secret:
      secretName: oci-release-secret
  - name: release-images-secret
    secret:
      secretName: ghcr-creds
  - name: github-secret
    secret:
      secretName: github-token
