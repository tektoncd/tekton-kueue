name: Release artifact verification

on:
  pull_request:
    paths:
      - hack/verify-release-artifacts.sh
      - hack/verify-release-artifacts_test.sh
      - .github/workflows/release-verification.yaml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check verifier syntax and behavior
        run: |
          bash -n hack/verify-release-artifacts.sh hack/verify-release-artifacts_test.sh
          bash hack/verify-release-artifacts_test.sh
