name: E2E Tests

on:
  workflow_call:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMG: konflux-ci.dev/tekton-kueue:v0.0.1
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install pinned kind release (uses its default node image)
        # Renovate updates KIND_VERSION automatically; only stable releases are proposed.
        # The cluster uses the node image this kind release defaults to, so the two
        # always match.
        run: |
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          KIND_VERSION=v0.32.0
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster
        env:
          KIND_EXPERIMENTAL_PROVIDER: podman

      - name: Build and load instrumented image
        env:
          KIND_EXPERIMENTAL_PROVIDER: podman
          ENABLE_COVERAGE: "true"
        run: |
          go mod tidy
          make load-image "IMG=$IMG"
          podman exec kind-control-plane crictl images

      - name: Install Kueue and Tekton
        run: |
          make kueue
          make tekton

      - name: Run e2e tests
        env:
          KIND_EXPERIMENTAL_PROVIDER: podman
          SKIP_CLEANUP: "true"
        run: make test-e2e

      - name: Collect e2e coverage
        if: always()
        run: |
          mkdir -p coverage-output && chmod 777 coverage-output
          cp "$HOME/.kube/config" /tmp/kubeconfig && chmod 644 /tmp/kubeconfig
          podman run --rm \
            --network host \
            -v /tmp/kubeconfig:/kubeconfig:ro \
            -v "$PWD/coverage-output:/workspace/coverage-output" \
            -e KUBECONFIG=/kubeconfig \
            quay.io/konflux-ci/konflux-devprod/coverport-cli \
            collect \
              --namespace=tekton-kueue \
              --label-selector=control-plane=controller-manager \
              --test-name=e2e-tests \
              --output=/workspace/coverage-output || true

      - name: Upload e2e coverage to Codecov
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          flags: e2e-tests
          directory: coverage-output
          fail_ci_if_error: false
