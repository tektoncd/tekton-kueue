name: Tests

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Running Tests
        run: |
          go mod tidy
          make test
          make verify-release
          CONTAINER_TOOL=docker make verify-release-config
          git diff --exit-code

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          flags: unit-tests
          files: ./cover.out
          fail_ci_if_error: false
