name: Patch Release

"on":
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch"
        required: true
        type: string
      version:
        description: "Version to release (for example, v0.5.1)"
        required: true
        type: string
      release_as_latest:
        description: "Publish as latest release"
        required: false
        type: boolean
        default: true
  schedule:
  - cron: "0 10 * * 4"

permissions:
  contents: read

env:
  PAC_CONTROLLER_URL: https://pac.infra.tekton.dev
  PAC_REPOSITORY_NAME: tektoncd-tekton-kueue
  # v0.3 is the oldest release line scanned for automatic patch releases.
  MIN_RELEASE_VERSION: "0.3"

jobs:
  scan-release-branches:
    name: Scan for unreleased commits
    if: github.event_name == 'schedule' && github.repository_owner == 'tektoncd'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      has_releases: ${{ steps.scan.outputs.has_releases }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Scan release branches for new commits
      id: scan
      shell: bash
      run: |
        latest_branch=""
        latest_major=0
        latest_minor=0
        for ref in $(git branch -r --list 'origin/release-v*'); do
          branch="${ref#origin/}"
          if [[ "$branch" =~ ^release-v([0-9]+)\.([0-9]+)\.x$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            if [ "$major" -gt "$latest_major" ] || { [ "$major" -eq "$latest_major" ] && [ "$minor" -gt "$latest_minor" ]; }; then
              latest_major=$major
              latest_minor=$minor
              latest_branch=$branch
            fi
          fi
        done
        echo "::notice::Latest release branch: ${latest_branch}"

        min_major="${MIN_RELEASE_VERSION%%.*}"
        min_minor="${MIN_RELEASE_VERSION##*.}"
        releases=()

        for ref in $(git branch -r --list 'origin/release-v*'); do
          branch="${ref#origin/}"
          if [[ ! "$branch" =~ ^release-v([0-9]+)\.([0-9]+)\.x$ ]]; then
            echo "::notice::Ignoring unsupported branch name ${branch}"
            continue
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          if [ "$major" -lt "$min_major" ] || { [ "$major" -eq "$min_major" ] && [ "$minor" -lt "$min_minor" ]; }; then
            continue
          fi

          last_tag=$(git describe --tags --abbrev=0 --match "v${major}.${minor}.*" "$ref" 2>/dev/null || true)
          if [ -z "$last_tag" ]; then
            echo "::notice::Branch ${branch} has no release tag; branch creation handles its initial release"
            continue
          fi

          new_commits=$(git rev-list "${last_tag}..${ref}" --count)
          if [ "$new_commits" -eq 0 ]; then
            continue
          fi

          next_version=$(echo "$last_tag" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
          is_latest=false
          [ "$branch" = "$latest_branch" ] && is_latest=true
          releases+=("{\"branch\":\"${branch}\",\"version\":\"${next_version}\",\"release_as_latest\":\"${is_latest}\"}")
        done

        if [ ${#releases[@]} -eq 0 ]; then
          echo "matrix=[]" >> "$GITHUB_OUTPUT"
          echo "has_releases=false" >> "$GITHUB_OUTPUT"
        else
          echo "matrix=[$(IFS=,; echo "${releases[*]}")]" >> "$GITHUB_OUTPUT"
          echo "has_releases=true" >> "$GITHUB_OUTPUT"
        fi

  trigger-scanned-releases:
    name: "Trigger ${{ matrix.release.version }} (${{ matrix.release.branch }})"
    needs: scan-release-branches
    if: needs.scan-release-branches.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        release: ${{ fromJson(needs.scan-release-branches.outputs.matrix) }}
    steps:
    - name: Trigger Pipelines as Code
      env:
        PAC_INCOMING_SECRET: ${{ secrets.PAC_INCOMING_SECRET }}
        RELEASE_BRANCH: ${{ matrix.release.branch }}
        RELEASE_VERSION: ${{ matrix.release.version }}
        RELEASE_AS_LATEST: ${{ matrix.release.release_as_latest }}
      run: |
        jq -n '{
          repository: env.PAC_REPOSITORY_NAME,
          branch: env.RELEASE_BRANCH,
          pipelinerun: "release-patch",
          secret: env.PAC_INCOMING_SECRET,
          params: {
            version: env.RELEASE_VERSION,
            release_as_latest: env.RELEASE_AS_LATEST
          }
        }' | curl --fail-with-body --silent --show-error \
          -H "Content-Type: application/json" \
          --data-binary @- \
          "${PAC_CONTROLLER_URL}/incoming"

  trigger-manual-release:
    name: "Trigger ${{ inputs.version }} (${{ inputs.branch }})"
    if: github.event_name == 'workflow_dispatch' && github.repository_owner == 'tektoncd'
    runs-on: ubuntu-latest
    steps:
    - name: Validate inputs
      env:
        BRANCH: ${{ inputs.branch }}
        VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        if [[ ! "$BRANCH" =~ ^release-v([0-9]+)\.([0-9]+)\.x$ ]]; then
          echo "::error::Invalid branch format: ${BRANCH}"
          exit 1
        fi
        branch_major="${BASH_REMATCH[1]}"
        branch_minor="${BASH_REMATCH[2]}"

        if [[ ! "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "::error::Invalid version format: ${VERSION}"
          exit 1
        fi
        if [ "$branch_major" != "${BASH_REMATCH[1]}" ] || [ "$branch_minor" != "${BASH_REMATCH[2]}" ]; then
          echo "::error::Version ${VERSION} does not belong to ${BRANCH}"
          exit 1
        fi
        if [ "${BASH_REMATCH[3]}" -eq 0 ]; then
          echo "::error::Initial releases are created by pushing the release branch"
          exit 1
        fi

    - name: Trigger Pipelines as Code
      env:
        PAC_INCOMING_SECRET: ${{ secrets.PAC_INCOMING_SECRET }}
        RELEASE_BRANCH: ${{ inputs.branch }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_AS_LATEST: ${{ inputs.release_as_latest }}
      run: |
        jq -n '{
          repository: env.PAC_REPOSITORY_NAME,
          branch: env.RELEASE_BRANCH,
          pipelinerun: "release-patch",
          secret: env.PAC_INCOMING_SECRET,
          params: {
            version: env.RELEASE_VERSION,
            release_as_latest: env.RELEASE_AS_LATEST
          }
        }' | curl --fail-with-body --silent --show-error \
          -H "Content-Type: application/json" \
          --data-binary @- \
          "${PAC_CONTROLLER_URL}/incoming"
