# Single source of truth for the golangci-lint binary version. The Makefile
# parses this marker and the lint workflow reads it back via
# `make golangci-lint-version`, so the pin only lives here.
# The "version" key below is the config schema version, not the binary version.
# renovate: datasource=github-releases depName=golangci/golangci-lint
# golangci-lint-version: v2.15.0
version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      # Repeated literals in table-driven tests are fixture data, not
      # constants worth extracting.
      ignore-tests: true
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
