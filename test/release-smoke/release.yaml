apiVersion: v1
kind: Namespace
metadata:
  name: tekton-kueue
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekton-kueue-controller-manager
  namespace: tekton-kueue
spec:
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      containers:
        - name: manager
          image: ghcr.io/tektoncd/tekton-kueue:v0.4.3@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekton-kueue-webhook
  namespace: tekton-kueue
spec:
  selector:
    matchLabels:
      app: webhook
  template:
    metadata:
      labels:
        app: webhook
    spec:
      containers:
        - name: webhook
          image: ghcr.io/tektoncd/tekton-kueue@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
